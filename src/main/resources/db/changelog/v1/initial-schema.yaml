databaseChangeLog:
  - changeSet:
      id: 1
      author: Anntena09
      changes:
        - createTable:
            tableName: currencies
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: base_currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: price_change_range
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT